<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacked your system</title>
    <style>
        body{
            background-color: black;
            color: green;
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <script>
        
        console.log("Hacked your system");
         const addItem = async (item)=>{
            await randomDelay();
            let div = document.createElement('div');
            div.innerHTML  = item;
            document.body.append(div);
        }
        const randomDelay = ()=>{
            return new Promise((resolve,reject)=>{
                timeout = 1 + 6 * Math.random() * 1000;
                setTimeout(() => {
                    resolve();
                }, timeout);
            })
        }   
    async function main(){

            let t=setInterval(() => {
                let last = document.body.lastElementChild;
                if (last.innerHTML.endsWith("...")){
                    last.innerHTML = last.innerHTML.slice(0, -3);
                    return;
                }
                else{

                    last.innerHTML += '.'; 
                }
            }, 100);
            let a =['Initializing hacking','Reading your files','passwords files Detected','Sending all passwords and presonal files to server','cleaning up','Done! You are hacked'];
            
            for (const item of a ){
                await addItem(item);
            }
            await randomDelay();
            clearInterval(t);
        }
        main();
     
    </script>
</body>
</html>
